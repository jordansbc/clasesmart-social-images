<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="DejaVu Sans, sans-serif">
  <rect width="1080" height="1350" fill="#1E3A8A"/>

  <!-- subtle decorative circles -->
  <circle cx="120" cy="180" r="140" fill="#F97316" opacity="0.10"/>
  <circle cx="980" cy="1180" r="200" fill="#F97316" opacity="0.10"/>
  <circle cx="1010" cy="150" r="90" fill="#FFF7ED" opacity="0.06"/>
  <circle cx="90" cy="1080" r="110" fill="#FFF7ED" opacity="0.05"/>

  <!-- friendly owl peeking in top-right corner -->
  <g transform="translate(915,95)">
    <!-- body -->
    <path d="M -70 30 Q -70 -55 0 -55 Q 70 -55 70 30 Q 70 110 0 110 Q -70 110 -70 30 Z" fill="#F97316"/>
    <!-- tummy -->
    <path d="M -42 40 Q -42 -20 0 -20 Q 42 -20 42 40 Q 42 90 0 90 Q -42 90 -42 40 Z" fill="#FFF7ED"/>
    <!-- ear tufts -->
    <path d="M -60 -38 L -40 -80 L -22 -42 Z" fill="#F97316"/>
    <path d="M 60 -38 L 40 -80 L 22 -42 Z" fill="#F97316"/>
    <!-- eyes -->
    <circle cx="-26" cy="10" r="26" fill="#FFF7ED"/>
    <circle cx="26" cy="10" r="26" fill="#FFF7ED"/>
    <circle cx="-26" cy="12" r="12" fill="#1E3A8A"/>
    <circle cx="26" cy="12" r="12" fill="#1E3A8A"/>
    <circle cx="-22" cy="8" r="4" fill="#FFF7ED"/>
    <circle cx="30" cy="8" r="4" fill="#FFF7ED"/>
    <!-- triangle beak -->
    <path d="M -10 34 L 10 34 L 0 54 Z" fill="#1E3A8A"/>
  </g>

  <!-- hook text panel -->
  <rect x="70" y="150" width="940" height="360" rx="40" fill="#FFF7ED"/>
  <text x="540" y="248" text-anchor="middle" font-size="58" font-weight="bold" fill="#1E3A8A">POV: dijiste</text>
  <text x="540" y="330" text-anchor="middle" font-size="62" font-weight="bold" fill="#F97316">"saquen una hoja"</text>
  <text x="540" y="410" text-anchor="middle" font-size="54" font-weight="bold" fill="#1E3A8A">y el salón entero</text>
  <text x="540" y="478" text-anchor="middle" font-size="54" font-weight="bold" fill="#1E3A8A">entró en pánico</text>

  <!-- illustration: open desk drawer overflowing with supplies -->
  <g transform="translate(540,880)">
    <!-- drawer box -->
    <rect x="-360" y="-60" width="720" height="320" rx="28" fill="#F97316"/>
    <rect x="-360" y="-60" width="720" height="320" rx="28" fill="none" stroke="#FFF7ED" stroke-width="6" opacity="0.5"/>
    <!-- drawer inner shadow -->
    <rect x="-330" y="-30" width="660" height="270" rx="20" fill="#c95d10"/>
    <!-- drawer handle -->
    <rect x="-70" y="230" width="140" height="26" rx="13" fill="#FFF7ED"/>

    <!-- markers (plumones) -->
    <g>
      <rect x="-300" y="-140" width="34" height="150" rx="10" fill="#1E3A8A" transform="rotate(-12 -283 -65)"/>
      <rect x="-256" y="-150" width="34" height="160" rx="10" fill="#FFF7ED" transform="rotate(-4 -239 -70)"/>
      <rect x="-210" y="-158" width="34" height="168" rx="10" fill="#1E3A8A" transform="rotate(6 -193 -74)"/>
      <rect x="-166" y="-146" width="34" height="156" rx="10" fill="#F97316" stroke="#c95d10" stroke-width="4" transform="rotate(14 -149 -68)"/>
      <!-- marker caps -->
      <rect x="-300" y="-140" width="34" height="34" rx="10" fill="#c95d10" transform="rotate(-12 -283 -65)"/>
      <rect x="-256" y="-150" width="34" height="34" rx="10" fill="#c95d10" transform="rotate(-4 -239 -70)"/>
      <rect x="-210" y="-158" width="34" height="34" rx="10" fill="#c95d10" transform="rotate(6 -193 -74)"/>
    </g>

    <!-- band-aids (curitas) -->
    <g transform="translate(150,-120) rotate(28)">
      <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#FFF7ED"/>
      <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#F97316" opacity="0.5"/>
    </g>
    <g transform="translate(240,-70) rotate(-18)">
      <rect x="-58" y="-19" width="116" height="38" rx="19" fill="#FFF7ED"/>
      <rect x="-15" y="-15" width="30" height="30" rx="6" fill="#1E3A8A" opacity="0.4"/>
    </g>

    <!-- confiscated yoyo -->
    <g transform="translate(60,60)">
      <circle cx="0" cy="0" r="52" fill="#1E3A8A"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FFF7ED" stroke-width="5"/>
      <circle cx="0" cy="0" r="12" fill="#FFF7ED"/>
      <path d="M 0 -52 Q 40 -110 20 -150" fill="none" stroke="#FFF7ED" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- stickers (calcomanías) -->
    <g transform="translate(-120,80)">
      <path d="M 0 -34 L 10 -10 L 36 -10 L 15 6 L 23 32 L 0 16 L -23 32 L -15 6 L -36 -10 L -10 -10 Z" fill="#FFF7ED"/>
    </g>
    <g transform="translate(-220,120)">
      <path d="M 0 -26 L 8 -8 L 28 -8 L 12 4 L 18 24 L 0 12 L -18 24 L -12 4 L -28 -8 L -8 -8 Z" fill="#1E3A8A" stroke="#FFF7ED" stroke-width="3"/>
    </g>
    <circle cx="270" cy="60" r="28" fill="#FFF7ED"/>
    <circle cx="270" cy="60" r="16" fill="#F97316" opacity="0.6"/>
  </g>

  <!-- '3 mitades mágicas' overlay badge -->
  <g transform="translate(540,640)">
    <rect x="-260" y="-52" width="520" height="104" rx="52" fill="#F97316"/>
    <rect x="-260" y="-52" width="520" height="104" rx="52" fill="none" stroke="#FFF7ED" stroke-width="5"/>
    <text x="0" y="18" text-anchor="middle" font-size="58" font-weight="bold" fill="#FFF7ED">3 mitades mágicas</text>
  </g>

  <!-- ClaseSmart wordmark -->
  <text x="540" y="1300" text-anchor="middle" font-size="66" font-weight="bold" fill="#F97316" letter-spacing="2">ClaseSmart</text>
</svg>
