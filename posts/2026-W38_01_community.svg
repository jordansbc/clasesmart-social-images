<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#152C66"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7ED" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF7ED" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Subtle decorative circles -->
  <circle cx="120" cy="180" r="200" fill="#F97316" opacity="0.07"/>
  <circle cx="980" cy="120" r="140" fill="#FFF7ED" opacity="0.05"/>
  <circle cx="1000" cy="760" r="240" fill="#F97316" opacity="0.06"/>
  <circle cx="90" cy="900" r="120" fill="#FFF7ED" opacity="0.05"/>
  <circle cx="540" cy="1300" r="300" fill="#F97316" opacity="0.05"/>

  <!-- Small accent kicker -->
  <rect x="90" y="95" width="230" height="60" rx="30" fill="#F97316"/>
  <text x="205" y="136" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" fill="#FFF7ED" text-anchor="middle" letter-spacing="2">PARA MAESTRAS</text>

  <!-- Cream text panel with the hook -->
  <rect x="80" y="200" width="920" height="470" rx="42" fill="#FFF7ED"/>
  <rect x="80" y="200" width="18" height="470" rx="9" fill="#F97316"/>

  <text x="130" y="300" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="bold" fill="#F97316" letter-spacing="1">POV:</text>

  <text font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="bold" fill="#1E3A8A">
    <tspan x="130" y="390">son las 6 pm del</tspan>
    <tspan x="130" y="468">domingo y ya andas</tspan>
    <tspan x="130" y="546">pensando en el</tspan>
    <tspan x="130" y="624" fill="#F97316">lunes</tspan>
  </text>

  <!-- Orange headline strip -->
  <text x="90" y="740" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="bold" fill="#F97316">
    <tspan x="90" y="740">Domingo 6 pm:</tspan>
    <tspan x="90" y="792">la cabeza ya está en el lunes</tspan>
  </text>

  <!-- ===== Table scene: notebook + steaming coffee ===== -->
  <!-- Table surface -->
  <rect x="90" y="1010" width="900" height="180" rx="20" fill="#0F1F4D" opacity="0.55"/>
  <rect x="90" y="1010" width="900" height="14" rx="7" fill="#F97316" opacity="0.35"/>

  <!-- Notebook -->
  <g>
    <rect x="150" y="900" width="360" height="200" rx="14" fill="#FFF7ED"/>
    <rect x="150" y="900" width="60" height="200" rx="14" fill="#F97316"/>
    <rect x="196" y="900" width="10" height="200" fill="#1E3A8A" opacity="0.15"/>
    <line x1="250" y1="950" x2="470" y2="950" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
    <line x1="250" y1="990" x2="470" y2="990" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
    <line x1="250" y1="1030" x2="440" y2="1030" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
    <line x1="250" y1="1070" x2="470" y2="1070" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
    <!-- spiral rings -->
    <circle cx="180" cy="930" r="8" fill="none" stroke="#1E3A8A" stroke-width="5" opacity="0.5"/>
    <circle cx="180" cy="980" r="8" fill="none" stroke="#1E3A8A" stroke-width="5" opacity="0.5"/>
    <circle cx="180" cy="1030" r="8" fill="none" stroke="#1E3A8A" stroke-width="5" opacity="0.5"/>
    <circle cx="180" cy="1070" r="8" fill="none" stroke="#1E3A8A" stroke-width="5" opacity="0.5"/>
  </g>

  <!-- Coffee cup with steam -->
  <g>
    <!-- steam -->
    <path d="M700 830 q -22 -30 0 -60 q 22 -30 0 -60" fill="none" stroke="url(#steam)" stroke-width="10" stroke-linecap="round"/>
    <path d="M745 830 q -22 -30 0 -60 q 22 -30 0 -60" fill="none" stroke="url(#steam)" stroke-width="10" stroke-linecap="round"/>
    <!-- cup body -->
    <path d="M620 860 h180 v70 a90 90 0 0 1 -180 0 z" fill="#FFF7ED"/>
    <ellipse cx="710" cy="860" rx="90" ry="26" fill="#F97316"/>
    <ellipse cx="710" cy="860" rx="66" ry="17" fill="#7C3A12"/>
    <!-- handle -->
    <path d="M800 885 q 60 0 60 45 q 0 45 -60 45" fill="none" stroke="#FFF7ED" stroke-width="18"/>
    <!-- saucer -->
    <ellipse cx="710" cy="1010" rx="140" ry="26" fill="#FFF7ED" opacity="0.9"/>
  </g>

  <!-- ===== Friendly OWL peeking in bottom-right corner ===== -->
  <g>
    <!-- body -->
    <path d="M900 1350 q -110 0 -110 -120 q 0 -140 110 -140 q 110 0 110 140 q 0 120 -110 120 z" fill="#F97316"/>
    <!-- belly -->
    <ellipse cx="900" cy="1290" rx="70" ry="80" fill="#FFF7ED"/>
    <!-- ear tufts -->
    <path d="M840 1105 l -20 -55 l 48 30 z" fill="#F97316"/>
    <path d="M960 1105 l 20 -55 l -48 30 z" fill="#F97316"/>
    <!-- eyes -->
    <circle cx="865" cy="1195" r="42" fill="#FFF7ED"/>
    <circle cx="935" cy="1195" r="42" fill="#FFF7ED"/>
    <circle cx="865" cy="1200" r="22" fill="#1E3A8A"/>
    <circle cx="935" cy="1200" r="22" fill="#1E3A8A"/>
    <circle cx="873" cy="1193" r="7" fill="#FFF7ED"/>
    <circle cx="943" cy="1193" r="7" fill="#FFF7ED"/>
    <!-- beak -->
    <path d="M900 1225 l -18 26 l 36 0 z" fill="#1E3A8A"/>
    <!-- little wing -->
    <path d="M820 1250 q -20 40 8 78 q 18 -6 22 -40 z" fill="#EA6A0C"/>
  </g>

  <!-- Wordmark -->
  <text x="90" y="1320" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="bold" fill="#FFF7ED" letter-spacing="1">ClaseSmart</text>
</svg>
