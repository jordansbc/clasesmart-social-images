<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- Background -->
  <rect width="1080" height="1350" fill="#1E3A8A"/>

  <!-- Subtle decorative circles -->
  <circle cx="120" cy="180" r="140" fill="#3B5BB5" opacity="0.35"/>
  <circle cx="980" cy="120" r="90" fill="#3B5BB5" opacity="0.30"/>
  <circle cx="1010" cy="760" r="120" fill="#3B5BB5" opacity="0.28"/>
  <circle cx="70" cy="1020" r="110" fill="#3B5BB5" opacity="0.30"/>
  <circle cx="930" cy="1240" r="70" fill="#F97316" opacity="0.20"/>
  <circle cx="160" cy="1250" r="46" fill="#F97316" opacity="0.20"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1080" height="16" fill="#F97316"/>

  <!-- Hook text panel -->
  <rect x="70" y="70" width="940" height="330" rx="40" ry="40" fill="#FFF7ED"/>
  <rect x="70" y="70" width="940" height="330" rx="40" ry="40" fill="none" stroke="#F97316" stroke-width="8"/>
  <text x="540" y="175" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="bold" fill="#1E3A8A" text-anchor="middle">&#191;Ya no son "materias"?</text>
  <text x="540" y="260" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="bold" fill="#1E3A8A" text-anchor="middle">En la NEM ahora son</text>
  <rect x="300" y="298" width="480" height="76" rx="20" ry="20" fill="#F97316"/>
  <text x="540" y="352" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="bold" fill="#FFF7ED" text-anchor="middle">4 campos formativos</text>

  <!-- Connector branches from NEM center (540,760) to the 4 nodes -->
  <g stroke="#F97316" stroke-width="12" stroke-linecap="round">
    <line x1="540" y1="760" x2="250" y2="600"/>
    <line x1="540" y1="760" x2="830" y2="600"/>
    <line x1="540" y1="760" x2="250" y2="920"/>
    <line x1="540" y1="760" x2="830" y2="920"/>
  </g>

  <!-- Central NEM circle -->
  <circle cx="540" cy="760" r="98" fill="#F97316"/>
  <circle cx="540" cy="760" r="98" fill="none" stroke="#FFF7ED" stroke-width="8"/>
  <text x="540" y="778" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="bold" fill="#1E3A8A" text-anchor="middle">NEM</text>

  <!-- ============ NODE 1: Lenguajes (libro) ============ -->
  <g>
    <circle cx="250" cy="600" r="76" fill="#FFF7ED"/>
    <circle cx="250" cy="600" r="76" fill="none" stroke="#F97316" stroke-width="7"/>
    <!-- book icon -->
    <g transform="translate(250,600)">
      <path d="M -34 -20 Q -17 -27 0 -20 L 0 20 Q -17 13 -34 20 Z" fill="#1E3A8A"/>
      <path d="M 34 -20 Q 17 -27 0 -20 L 0 20 Q 17 13 34 20 Z" fill="#1E3A8A"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#FFF7ED" stroke-width="4"/>
    </g>
    <text x="250" y="712" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFF7ED" text-anchor="middle">Lenguajes</text>
  </g>

  <!-- ============ NODE 2: Saberes y Pensamiento Científico (lupa) ============ -->
  <g>
    <circle cx="830" cy="600" r="76" fill="#FFF7ED"/>
    <circle cx="830" cy="600" r="76" fill="none" stroke="#F97316" stroke-width="7"/>
    <!-- magnifying glass icon -->
    <g transform="translate(830,600)">
      <circle cx="-8" cy="-8" r="22" fill="none" stroke="#1E3A8A" stroke-width="9"/>
      <line x1="9" y1="9" x2="28" y2="28" stroke="#1E3A8A" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="830" y="712" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFF7ED" text-anchor="middle">Saberes y Pensamiento</text>
    <text x="830" y="744" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFF7ED" text-anchor="middle">Cient&#237;fico</text>
  </g>

  <!-- ============ NODE 3: Ética, Naturaleza y Sociedades (planeta) ============ -->
  <g>
    <circle cx="250" cy="920" r="76" fill="#FFF7ED"/>
    <circle cx="250" cy="920" r="76" fill="none" stroke="#F97316" stroke-width="7"/>
    <!-- planet icon -->
    <g transform="translate(250,920)">
      <circle cx="0" cy="0" r="22" fill="#1E3A8A"/>
      <ellipse cx="0" cy="0" rx="36" ry="13" fill="none" stroke="#F97316" stroke-width="7" transform="rotate(-25)"/>
    </g>
    <text x="250" y="1032" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFF7ED" text-anchor="middle">&#201;tica, Naturaleza</text>
    <text x="250" y="1064" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFF7ED" text-anchor="middle">y Sociedades</text>
  </g>

  <!-- ============ NODE 4: De lo Humano y lo Comunitario (manos) ============ -->
  <g>
    <circle cx="830" cy="920" r="76" fill="#FFF7ED"/>
    <circle cx="830" cy="920" r="76" fill="none" stroke="#F97316" stroke-width="7"/>
    <!-- hands (cupped) icon -->
    <g transform="translate(830,920)">
      <path d="M -32 -4 Q -32 26 -6 30 L 6 30 Q 32 26 32 -4 Q 22 6 6 6 L -6 6 Q -22 6 -32 -4 Z" fill="#1E3A8A"/>
      <circle cx="0" cy="-18" r="10" fill="#F97316"/>
    </g>
    <text x="830" y="1032" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFF7ED" text-anchor="middle">De lo Humano</text>
    <text x="830" y="1064" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFF7ED" text-anchor="middle">y lo Comunitario</text>
  </g>

  <!-- ============ Friendly OWL (closing mascot) ============ -->
  <g transform="translate(540,1150)">
    <!-- ear tufts -->
    <path d="M -46 -78 L -22 -44 L -58 -50 Z" fill="#F97316"/>
    <path d="M 46 -78 L 22 -44 L 58 -50 Z" fill="#F97316"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="82" ry="92" fill="#FFF7ED"/>
    <ellipse cx="0" cy="0" rx="82" ry="92" fill="none" stroke="#F97316" stroke-width="7"/>
    <!-- belly -->
    <ellipse cx="0" cy="24" rx="46" ry="56" fill="#F97316" opacity="0.30"/>
    <!-- eyes -->
    <circle cx="-32" cy="-24" r="30" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="6"/>
    <circle cx="32" cy="-24" r="30" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="6"/>
    <circle cx="-32" cy="-24" r="13" fill="#1E3A8A"/>
    <circle cx="32" cy="-24" r="13" fill="#1E3A8A"/>
    <!-- beak (triangle) -->
    <path d="M 0 -6 L -16 6 L 16 6 Z" fill="#F97316"/>
    <!-- feet -->
    <path d="M -30 86 l -12 14 M -30 86 l 0 16 M -30 86 l 12 14" stroke="#F97316" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 30 86 l -12 14 M 30 86 l 0 16 M 30 86 l 12 14" stroke="#F97316" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="540" y="1305" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#FFF7ED" text-anchor="middle">ClaseSmart</text>
</svg>
