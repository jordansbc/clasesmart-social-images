<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#172F6E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1E52" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#bg)"/>

  <!-- Subtle decorative circles -->
  <circle cx="120" cy="180" r="150" fill="#F97316" opacity="0.10"/>
  <circle cx="990" cy="120" r="90" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="1010" cy="720" r="180" fill="#F97316" opacity="0.08"/>
  <circle cx="70" cy="980" r="120" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="540" cy="1300" r="220" fill="#F97316" opacity="0.06"/>

  <!-- ===== HOOK TEXT PANEL ===== -->
  <rect x="60" y="80" width="960" height="440" rx="40" fill="#FFF7ED" filter="url(#soft)"/>
  <rect x="60" y="80" width="18" height="440" rx="9" fill="#F97316"/>

  <text font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#1E293B" text-anchor="middle">
    <tspan x="555" y="185" font-size="58">30 alumnos, 30 boletas…</tspan>
    <tspan x="555" y="268" font-size="46" font-weight="normal">y tú escribiendo la</tspan>
  </text>
  <text x="555" y="360" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="86" fill="#F97316" text-anchor="middle">MISMA observación</text>
  <text x="555" y="450" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="60" fill="#1E293B" text-anchor="middle">con copy-paste</text>

  <!-- ===== ILLUSTRATION AREA ===== -->

  <!-- Boleta / report card -->
  <g filter="url(#soft)">
    <rect x="95" y="580" width="360" height="440" rx="24" fill="#FFFFFF"/>
    <rect x="95" y="580" width="360" height="86" rx="24" fill="#1E3A8A"/>
    <rect x="95" y="640" width="360" height="26" fill="#1E3A8A"/>
    <text x="275" y="636" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="34" fill="#FFF7ED" text-anchor="middle">BOLETA</text>
    <!-- rows -->
    <g fill="#E5E7EB">
      <rect x="130" y="710" width="200" height="18" rx="9"/>
      <rect x="130" y="758" width="290" height="18" rx="9"/>
      <rect x="130" y="806" width="250" height="18" rx="9"/>
      <rect x="130" y="854" width="290" height="18" rx="9"/>
      <rect x="130" y="902" width="180" height="18" rx="9"/>
    </g>
    <!-- observaciones label + pen accent -->
    <rect x="130" y="946" width="230" height="20" rx="10" fill="#FDBA74"/>
    <circle cx="392" cy="720" r="26" fill="#F97316"/>
    <path d="M392 708 L400 728 L384 728 Z" fill="#FFFFFF"/>
  </g>

  <!-- Repeated identical bubbles (crossed out) -->
  <g font-family="DejaVu Sans, sans-serif">
    <!-- bubble 1 -->
    <g filter="url(#soft)">
      <rect x="520" y="590" width="470" height="96" rx="24" fill="#FFF7ED"/>
      <path d="M520 640 L494 628 L520 616 Z" fill="#FFF7ED"/>
    </g>
    <text x="548" y="648" font-size="34" fill="#64748B">Buen desempeño general.</text>
    <line x1="540" y1="640" x2="960" y2="640" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>

    <!-- bubble 2 -->
    <g filter="url(#soft)">
      <rect x="520" y="700" width="470" height="96" rx="24" fill="#FFF7ED"/>
      <path d="M520 750 L494 738 L520 726 Z" fill="#FFF7ED"/>
    </g>
    <text x="548" y="758" font-size="34" fill="#64748B">Buen desempeño general.</text>
    <line x1="540" y1="750" x2="960" y2="750" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>

    <!-- bubble 3 -->
    <g filter="url(#soft)">
      <rect x="520" y="810" width="470" height="96" rx="24" fill="#FFF7ED"/>
      <path d="M520 860 L494 848 L520 836 Z" fill="#FFF7ED"/>
    </g>
    <text x="548" y="868" font-size="34" fill="#64748B">Buen desempeño general.</text>
    <line x1="540" y1="860" x2="960" y2="860" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>

    <!-- bubble 4 (distinct, with check) -->
    <g filter="url(#soft)">
      <rect x="520" y="920" width="470" height="104" rx="24" fill="#F97316"/>
      <path d="M520 974 L494 962 L520 950 Z" fill="#F97316"/>
    </g>
    <text x="586" y="964" font-size="31" font-weight="bold" fill="#FFF7ED">Muestra iniciativa y</text>
    <text x="586" y="1002" font-size="31" font-weight="bold" fill="#FFF7ED">ayuda a sus compañeros.</text>
    <circle cx="552" cy="972" r="24" fill="#FFFFFF"/>
    <path d="M541 972 L549 981 L565 962" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== OVERLAY BANNER ===== -->
  <g filter="url(#soft)">
    <rect x="90" y="1068" width="900" height="118" rx="28" fill="#F97316"/>
  </g>
  <text x="540" y="1118" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="42" fill="#FFF7ED" text-anchor="middle">50 frases para no repetir</text>
  <text x="540" y="1166" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="42" fill="#FFF7ED" text-anchor="middle">la misma observación</text>

  <!-- ===== OWL ===== -->
  <g transform="translate(150,1210)">
    <!-- body -->
    <path d="M0 40 C0 -8 92 -8 92 40 L92 70 C92 104 0 104 0 70 Z" fill="#F97316"/>
    <!-- belly -->
    <ellipse cx="46" cy="66" rx="30" ry="34" fill="#FFF7ED"/>
    <!-- ears -->
    <path d="M8 6 L2 -20 L30 4 Z" fill="#F97316"/>
    <path d="M84 6 L90 -20 L62 4 Z" fill="#F97316"/>
    <!-- eyes -->
    <circle cx="30" cy="36" r="21" fill="#FFF7ED"/>
    <circle cx="62" cy="36" r="21" fill="#FFF7ED"/>
    <circle cx="30" cy="38" r="10" fill="#1E3A8A"/>
    <circle cx="62" cy="38" r="10" fill="#1E3A8A"/>
    <circle cx="33" cy="35" r="3" fill="#FFFFFF"/>
    <circle cx="65" cy="35" r="3" fill="#FFFFFF"/>
    <!-- beak (triangle) -->
    <path d="M46 50 L38 60 L54 60 Z" fill="#1E3A8A"/>
    <!-- feet -->
    <path d="M30 100 l-8 12 M30 100 l0 13 M30 100 l8 12" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"/>
    <path d="M62 100 l-8 12 M62 100 l0 13 M62 100 l8 12" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- speech tag near owl -->
  <text x="290" y="1268" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="30" fill="#FFF7ED">Cada alumno, una</text>
  <text x="290" y="1306" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="30" fill="#FDBA74">observación distinta.</text>

  <!-- ===== WORDMARK ===== -->
  <text x="820" y="1300" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="52" fill="#F97316" text-anchor="middle">ClaseSmart</text>
</svg>
